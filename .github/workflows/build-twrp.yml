name: Build TWRP Recovery

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
          - twrp-12.1
          - twrp-13.0
          - twrp-14.1

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Free up space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt clean
          
      - name: Initialize environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 10G
          
      - name: Setup repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          
      - name: Sync TWRP sources
        run: |
          mkdir twrp
          cd twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b ${{ github.event.inputs.MANIFEST_BRANCH }}
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
          
      - name: Clone device tree
        run: |
          cd twrp
          git clone https://github.com/xiaomi-sm8750-onyx/device_xiaomi_onyx-twrp.git -b miodm_onyx-user-15-AQ3A.250107.001-OS2.0.102.0.VOLMIXM-release-keys device/xiaomi/onyx
          
      - name: Add decrypt support
        run: |
          cd twrp/device/xiaomi/onyx
          # Aggiungi configurazione decrypt a BoardConfig.mk
          cat >> BoardConfig.mk << 'EOF'
          
          # Encryption
          TW_INCLUDE_CRYPTO := true
          TW_INCLUDE_CRYPTO_FBE := true
          TW_INCLUDE_FBE_METADATA_DECRYPT := true
          BOARD_USES_QCOM_FBE_DECRYPTION := true
          BOARD_USES_METADATA_PARTITION := true
          
          # Keymaster
          PLATFORM_VERSION := 127
          PLATFORM_VERSION_LAST_STABLE := $(PLATFORM_VERSION)
          EOF
          
      - name: Build TWRP
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export TW_DEFAULT_LANGUAGE="it"
          source build/envsetup.sh
          lunch omni_onyx-eng
          mka recoveryimage -j$(nproc --all)
          
      - name: Upload recovery
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-onyx-decrypt
          path: twrp/out/target/product/onyx/recovery.img
          retention-days: 30
